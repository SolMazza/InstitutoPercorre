<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- pesquisar para sobre matheus battisti bootstrap -->
    <h1>Bottons e estillo bootstrap</h1>

    <a href="#" class="btn btn-success">btn-success</a>
    <a href="#" class="btn btn-danger">btn-danger</a>
    <button type="button" class="btn btn-outline-dark">Outline Dark</button>
    <button type="button" class="btn btn-outline-info">outline info</button>
    <button type="button" class="btn btn-outline-primary">outline primary</button>
    <button type="button" class="btn btn-outline-secondary">outline secondary</button>
    <button type="button" class="btn btn-outline-warning">outline warning</button>
    <button type="button" class="btn btn-outline-danger">outline danger</button>
    <button type="button" class="btn btn-outline-success">outline success</button>
    <button type="button" class="btn btn-outline-light">outline light</button>
    <br>
    <!-- esse tem css da style.css junto -->
    <button type="button" class="btn meuEstilo btn-outline-light">Meu Estilo</button>
    <section id="carouselExample" class="carousel slide">
        <h2>UNIÃO DA JUVENTUDE E REBELIÃO!</h2>
        <p>estilização de img com bootstrap</p>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../figure/30anos.png" class="d-block " alt="...">
            </div>
            <div class="carousel-item">
                <img src="../figure/jav6x1.png" class="d-block " alt="capa do Jornal a Verdade, manchete">
            </div>
            <div class="carousel-item">
                <img src="../figure/sextoCongresso.png" class="d-block "
                    alt="poster escrito 6º Congresso da Juventude Rebelião. Ser Jovem é ser revolucionário e ser revolucionário é lutar pelo socialismo">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </section>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
