<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Css</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.typekit.net/ylf5umo.css">
</head>

<body>
    <section class="container">
        <!-- Grid Container: é o elemento ou classe que definimos a propriedade display: grid.
Então, esse elemento será o pai de todos os itens do Grid. -->
        <div class="box" id="n1">
            <h1>Kailo</h1>
        </div>
        <!--  Grid Item: são os filhos do grid container -->
        <div class="box" id="n2">
            <h2>TE AMO</h2>
            <p>Feliz 1 Ano de namoro!</p>
        </div>
        <div class="box" id="n3">
            <h3>tenho muito carinho por ti, muito obrigado por tudo, tudo</h3>
        </div>
    </section>
</body>

</html>
