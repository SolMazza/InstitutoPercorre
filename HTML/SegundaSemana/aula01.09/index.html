<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto Percorre</title>
    
    <!-- link da fonte "henny penny" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">

    <!-- link do ícone da aba, type define o tipo do arquivo, href define o caminho do arquivo -->
    <link rel="shortcut icon" type="image/png" href="img/imagemAba.png">
</head>

<body>
    <h1 style="font-family: 'Henny Penny', cursive;">Instituto Percorre</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. At necessitatibus sequi aut sed accusantium! Autem,
        distinctio sit esse iste, voluptates id magni impedit exercitationem obcaecati, repellat doloribus harum ab
        itaque.</p>
    

        <!-- tag img exibe uma imagem, o atributo src coloca o caminho do arquivo, o atributo alt descreve a imagem com leitor de tela para cegos -->
    <img src="img/manoelLisboa.jpeg" alt="Ficha de prisão de Manoel Lisboa de Moura - nascido em 21 de fevereiro de 1945" width="600">
    <br>

    <!-- tag video no src coloca o caminho do arquivo, o atributo controls exibe os controles do vídeo (paude, play, etc..), o atributo poster exibe uma imagem de capa antes do vídeo ser reproduzido -->
    <video src="img/filme.mp4" controls poster="img/manoelLisboa.jpeg" alt="Vídeo, uma parte do filme madagascar"></video>
</body>

</html>
